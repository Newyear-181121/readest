# ============================================================
# GitHub Actions 工作流配置文件
# 文件名: .github/workflows/docker-build.yml
# 作用: 手动触发（或自动）构建 Readest 项目的 Docker 镜像
#       并推送到 GitHub Container Registry (GHCR)
# ============================================================

# 工作流名称，在 GitHub Actions 界面显示
name: 构建 Docker 镜像

# 触发条件配置
on:
  # 允许手动触发（在仓库的 Actions 标签页点击 "Run workflow"）
  workflow_dispatch:

  # 自动触发：当 main 分支有代码推送时（如需自动构建，取消注释）
  # push:
  #   branches: [ main ]

# 全局环境变量，所有 job 中可用
env:
  # 容器镜像仓库地址（GitHub Container Registry）
  REGISTRY: ghcr.io
  # 镜像名称，格式: 用户名/仓库名
  IMAGE_NAME: ${{ github.repository }}

# 定义要执行的任务
jobs:
  # 任务 ID: build
  build:
    # 运行环境：最新版 Ubuntu
    runs-on: ubuntu-latest

    # 赋予该任务所需的权限
    permissions:
      # 允许读取仓库代码
      contents: read   
      # 允许推送镜像到 GHCR
      packages: write     

    # 任务的具体步骤（按顺序执行）
    steps:
      # 步骤1: 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 步骤2: 设置 QEMU（用于跨平台模拟，如在 x86 机器上构建 ARM 镜像）
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 步骤3: 设置 Docker Buildx（用于构建多平台镜像和高级构建功能）
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 步骤4: 登录到容器镜像仓库（GHCR）
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 步骤5: 构建并推送 Docker 镜像
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          # 构建上下文路径（默认为仓库根目录）
          context: .
          # Dockerfile 文件名（确保与仓库中的文件名一致）
          file: Dockerfile
          # 目标平台列表（可根据需要增减）
          platforms: linux/amd64,linux/arm64
          # 是否推送镜像到仓库
          push: true
          # 镜像标签（tag）
          # 注意：tag 行前不能有 # 注释，否则会被当作参数传递
          tags: |
            ghcr.io/newyear-181121/readest:latest
            ghcr.io/newyear-181121/readest:${{ github.sha }}
          # 构建参数（ARG）传递，对应 Dockerfile 中的 ARG 指令
          # 注意：参数行前不能有 # 注释，否则会被当作无效参数名
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_APP_PLATFORM=${{ secrets.NEXT_PUBLIC_APP_PLATFORM || 'web' }}
            NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL || '' }}
            NEXT_PUBLIC_OBJECT_STORAGE_TYPE=${{ secrets.NEXT_PUBLIC_OBJECT_STORAGE_TYPE || 'local' }}
            NEXT_PUBLIC_STORAGE_FIXED_QUOTA=${{ secrets.NEXT_PUBLIC_STORAGE_FIXED_QUOTA || '500' }}
            NEXT_PUBLIC_TRANSLATION_FIXED_QUOTA=${{ secrets.NEXT_PUBLIC_TRANSLATION_FIXED_QUOTA || '' }}
